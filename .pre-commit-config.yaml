repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/mwouts/jupytext
    rev: v1.16.4
    hooks:
      - id: jupytext
        # Keep each notebook paired with a percent-format .py for reviewable diffs.
        args: [--sync, --pipe, black]
        files: ^notebooks/
        additional_dependencies: [black]
